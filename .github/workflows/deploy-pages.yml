name: Pubblica Turni Smart

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verifica e prepara il sito
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui lint, test e build
        run: npm run check

      - name: Controlla le dipendenze
        run: npm run audit

      - name: Carica il sito compilato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
