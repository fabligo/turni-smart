name: Verifiche

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Esegui tutti i controlli
        run: npm run check

      - name: Controlla le dipendenze
        run: npm run audit
